name: Release

on:
  push:
    tags: ["v*"]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  RING_CLI_REPO: https://github.com/RingKoAI/Ring-CLI.git

jobs:
  # ── Resolve version + auto-tag develop pushes ──────────────────────────────
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version + tag
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push (v1.2.3) → strip v prefix
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # develop push → use short commit hash as both tag and version
            HASH="${GITHUB_SHA::7}"
            echo "version=$HASH" >> "$GITHUB_OUTPUT"
            echo "tag=$HASH" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag (develop pushes only)
        if: github.ref_type != 'tag'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          # Skip if tag already exists
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

  # ── Build per-platform ────────────────────────────────────────────────────
  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: darwin-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ring-app
        uses: actions/checkout@v4

      - name: Checkout ring-cli
        uses: actions/checkout@v4
        with:
          repository: RingKoAI/Ring-CLI
          path: ../ring-cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            ../ring-cli

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ring-cli sidecar
        env:
          RING_CLI_DIR: ${{ github.workspace }}/../ring-cli
        run: node scripts/build-sidecar.mjs --release

      - name: Patch version
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # package.json
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = process.env.VERSION;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "
          # Cargo.toml
          sed -i 's/^version = ".*"/version = "'"$VERSION"'"/' src-tauri/Cargo.toml

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.resolve-version.outputs.tag }}
          releaseName: "RingApp ${{ needs.resolve-version.outputs.tag }}"
          releaseBody: |
            ## RingApp ${{ needs.resolve-version.outputs.tag }}

            **Version**: `${{ needs.resolve-version.outputs.version }}`
            **Pre-release**: ${{ needs.resolve-version.outputs.is_prerelease }}

            Download the appropriate installer for your platform below.
          releaseDraft: false
          prerelease: ${{ needs.resolve-version.outputs.is_prerelease }}
          args: --target ${{ matrix.target }}
